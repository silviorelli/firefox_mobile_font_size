<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture page</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 16px/1.5 system-ui, sans-serif;
      }
      /* Absolute px sizes on purpose: the sizes a rem-based approach would miss. */
      h1 { font-size: 24px; }
      p { font-size: 16px; }
    </style>
  </head>
  <body>
    <h1 id="heading">A page to zoom</h1>
    <p id="paragraph">
      Body copy sized in absolute pixels, the case that only a real zoom can scale.
    </p>
  </body>
</html>
